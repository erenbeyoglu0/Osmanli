<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Osmanlı Padişahları - Yusuf Eren Beyoğlu</title>
    <style>
        :root {
            --primary-gold: #d4af37;
            --dark-bg: #0b0b0b;
            --card-bg: #141414;
            --panel-bg: #1a1a1a;
            --text-color: #f1f1f1;
        }

        body {
            background-color: var(--dark-bg);
            color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            padding-bottom: 140px;
        }

        header {
            text-align: center;
            padding: 30px 20px;
            border-bottom: 2px solid var(--primary-gold);
            background: linear-gradient(to bottom, #1f1f1f, var(--dark-bg));
        }

        header h1 {
            color: var(--primary-gold);
            font-size: 1.8rem;
            margin: 0;
            letter-spacing: 1px;
        }

        header p {
            color: #aaa;
            font-size: 0.95rem;
            margin-top: 8px;
        }

        /* Arama ve Filtreleme Alanı */
        .filter-section {
            max-width: 600px;
            margin: 20px auto;
            padding: 0 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .search-box {
            width: 100%;
            padding: 12px 16px;
            background: #141414;
            border: 1px solid var(--primary-gold);
            border-radius: 25px;
            color: #fff;
            font-size: 1rem;
            outline: none;
            box-sizing: border-box;
            text-align: center;
        }

        .search-box::placeholder {
            color: #888;
        }

        .era-filters {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
        }

        .era-btn {
            background: #1a1a1a;
            color: #ccc;
            border: 1px solid #444;
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .era-btn.active, .era-btn:hover {
            background: var(--primary-gold);
            color: #000;
            border-color: var(--primary-gold);
            font-weight: bold;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 10px 20px 20px 20px;
        }

        .sultan-card {
            background-color: var(--card-bg);
            border: 1px solid var(--primary-gold);
            border-radius: 12px;
            margin-bottom: 30px;
            overflow: hidden;
            box-shadow: 0 8px 20px rgba(0,0,0,0.6);
            text-align: center;
        }

        .sultan-header {
            font-size: 1.1rem;
            font-weight: bold;
            color: var(--primary-gold);
            padding: 15px;
            letter-spacing: 1px;
            border-bottom: 1px solid #222;
        }

        .image-container {
            width: 100%;
            height: 380px;
            overflow: hidden;
            background-color: #000;
            position: relative;
        }

        .image-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center 25%; 
            transition: transform 0.4s ease;
        }

        .image-container img:hover {
            transform: scale(1.03);
        }

        .sultan-name {
            font-size: 1.5rem;
            font-weight: bold;
            margin: 20px 0 10px 0;
            color: #fff;
            letter-spacing: 0.5px;
        }

        /* Metinleri dümdüz olmaktan çıkarıp şekilli, alıntılı ve şık bir karta dönüştüren stil */
        .sultan-quote-preview {
            padding: 0 25px;
            margin-bottom: 20px;
            font-style: italic;
            color: #d1d1d1;
            font-size: 0.95rem;
            line-height: 1.6;
            border-left: 3px solid var(--primary-gold);
            text-align: left;
            background: rgba(212, 175, 55, 0.03);
            padding: 12px 15px 12px 20px;
            border-radius: 0 8px 8px 0;
            margin: 15px 20px 20px 20px;
        }

        .play-btn {
            background: linear-gradient(135deg, #d4af37, #aa8c2c);
            color: #000;
            border: none;
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            margin-bottom: 25px;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(212, 175, 55, 0.3);
        }

        .play-btn:active {
            transform: scale(0.96);
        }

        #audio-panel {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background-color: var(--panel-bg);
            border-top: 2px solid var(--primary-gold);
            box-shadow: 0 -10px 25px rgba(0,0,0,0.8);
            transform: translateY(100%);
            transition: transform 0.3s ease-in-out;
            z-index: 1000;
            padding: 15px 20px;
            box-sizing: border-box;
        }

        #audio-panel.active {
            transform: translateY(0);
        }

        .panel-content {
            max-width: 600px;
            margin: 0 auto;
            position: relative;
        }

        .close-panel {
            position: absolute;
            top: 0;
            right: 0;
            background: none;
            border: 1px solid var(--primary-gold);
            color: var(--primary-gold);
            border-radius: 50%;
            width: 30px;
            height: 30px;
            font-size: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .panel-title {
            color: var(--primary-gold);
            font-size: 1.1rem;
            font-weight: bold;
            margin-bottom: 6px;
        }

        .panel-bio {
            font-size: 0.9rem;
            color: #ddd;
            line-height: 1.5;
            margin-bottom: 12px;
            max-height: 90px;
            overflow-y: auto;
            font-style: italic;
        }

        .panel-controls {
            display: flex;
            gap: 10px;
        }

        .control-btn {
            flex: 1;
            padding: 10px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            border: 1px solid var(--primary-gold);
            font-size: 0.9rem;
        }

        .btn-pause {
            background-color: var(--primary-gold);
            color: #000;
        }

        .btn-replay {
            background-color: transparent;
            color: var(--primary-gold);
        }

        .status-text {
            font-size: 0.75rem;
            color: #888;
            margin-top: 5px;
            text-align: center;
        }

        .feedback-section {
            max-width: 600px;
            margin: 40px auto 20px auto;
            background: var(--card-bg);
            border: 1px solid #333;
            border-radius: 12px;
            padding: 20px;
            box-sizing: border-box;
        }

        .feedback-section h3 {
            color: var(--primary-gold);
            font-size: 1.2rem;
            margin-top: 0;
            text-align: center;
        }

        .feedback-form input, .feedback-form textarea {
            width: 100%;
            padding: 10px;
            margin-bottom: 12px;
            background: #0b0b0b;
            border: 1px solid #444;
            border-radius: 6px;
            color: #fff;
            box-sizing: border-box;
            font-family: inherit;
        }

        .feedback-form button {
            width: 100%;
            background-color: var(--primary-gold);
            color: #000;
            border: none;
            padding: 10px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
        }

        footer {
            text-align: center;
            padding: 25px;
            color: var(--primary-gold);
            font-weight: bold;
            font-size: 0.95rem;
            border-top: 1px solid #222;
            margin-top: 40px;
            background-color: #0d0d0d;
        }
    </style>
</head>
<body>

    <header>
        <h1>OSMANLI PADİŞAHLARI</h1>
        <p>36 Osmanlı Padişahı Kendi Ağzından Biyografilerini Anlatıyor</p>
    </header>

    <!-- Arama ve Dönem Filtreleme Paneli -->
    <div class="filter-section">
        <input type="text" id="searchInput" class="search-box" placeholder="Padişah adı ile ara..." oninput="filterSultans()">
        <div class="era-filters">
            <button class="era-btn active" onclick="setEraFilter('all', this)">Tümü</button>
            <button class="era-btn" onclick="setEraFilter('kurulus', this)">Kuruluş</button>
            <button class="era-btn" onclick="setEraFilter('yukselme', this)">Yükselme</button>
            <button class="era-btn" onclick="setEraFilter('duraklama', this)">Duraklama</button>
            <button class="era-btn" onclick="setEraFilter('gerileme', this)">Gerileme</button>
            <button class="era-btn" onclick="setEraFilter('dagilma', this)">Dağılma</button>
        </div>
    </div>

    <div class="container" id="sultans-container">
        <!-- Padişah kartları dinamik yüklenir -->
    </div>

    <div class="feedback-section">
        <h3>Hata Bildir / Düzeltme Gönder</h3>
        <form class="feedback-form" action="https://formspree.io/f/xlgppvye" method="POST">
            <input type="email" name="email" placeholder="E-posta adresiniz" required>
            <textarea name="message" rows="3" placeholder="Bildirmek istediğiniz hata veya öneri..." required></textarea>
            <button type="submit">Doğrudan Gönder</button>
        </form>
    </div>

    <footer>Bu Proje Yusuf Eren Beyoğlu Tarafından Hazırlanmıştır © 2026</footer>

    <div id="audio-panel">
        <div class="panel-content">
            <button class="close-panel" onclick="closeAudioPanel()">&times;</button>
            <div class="panel-title" id="panel-sultan-name">Padişah Adı</div>
            <div class="panel-bio" id="panel-sultan-bio">Biyografi metni</div>
            <div class="panel-controls">
                <button class="control-btn btn-pause" id="pause-play-btn" onclick="togglePlayPause()">DURDUR</button>
                <button class="control-btn btn-replay" onclick="replayAudio()">TEKRAR OYNAT</button>
            </div>
            <div class="status-text" id="audio-status">SESLİ ANLATIM ÇALINIYOR...</div>
        </div>
    </div>

    <script>
        const sultans = [
            { id: 1, name: "OSMAN GAZİ", era: "kurulus", img: "https://upload.wikimedia.org/wikipedia/commons/thumb/1/18/Osman_Gazi2.jpg/800px-Osman_Gazi2.jpg", bio: "Ben Osman Gazi! Kayı boyunun beyi Ertuğrul Gazi'nin oğluyum. 1299 yılında Söğüt ve Domaniç uç bölgesinde, çağlar kapatıp açacak olan Osmanlı Cihan Devleti'nin temellerini attım. Şeyh Edebali'nin 'İnsanı yaşat ki devlet yaşasın' buyruğunu devletimin temel ilkesi yaptım. Yarhisar, Bilecik, İnegöl ve Yenişehir'i fethederek beyliğimi bağımsız bir devlet haline getirdim." },
            { id: 2, name: "ORHAN GAZİ", era: "kurulus", img: "https://upload.wikimedia.org/wikipedia/commons/thumb/8/8b/Orhan_Gazi.jpg/800px-Orhan_Gazi.jpg", bio: "Ben Orhan Gazi! Babam Osman Bey'den aldığım aşiret mirasını kurumsallaşmış bir devlete dönüştürdüm. 1326'da Bursa'yı fethedip devletimizin ilk büyük başkenti yaptım. İlk Osmanlı gümüş akçesini bastırdım, Yaya ve Müsellem adıyla ilk düzenli orduyu kurdum ve Çimpe Kalesi'ni alarak Rumeli'ye ilk Türk adımını attım." },
            { id: 3, name: "I. MURAD (HÜDAVENDİGÂR)", era: "kurulus", img: "https://upload.wikimedia.org/wikipedia/commons/thumb/1/10/Murat_H%C3%BCdavendigar.jpg/800px-Murat_H%C3%BCdavendigar.jpg", bio: "Ben Sultan I. Murad Hüdavendigâr! Edirne'yi fethedip devletin başkentini Rumeli'ye taşıdım. Devşirme sistemini kurarak Osmanlı ordusunun göz bebeği olan Yeniçeri Ocağı'nı faaliyete geçirdim. Sırpsındığı ve Çirmen savaşlarında Haçlı ordularını dize getirdim. I. Kosova Meydan Muharebesi'nde büyük bir zafer kazandıktan sonra şehit düştüm." },
            { id: 4, name: "YILDIRIM BAYEZİD", era: "kurulus", img: "https://upload.wikimedia.org/wikipedia/commons/thumb/d/d4/Y%C4%B1ld%C4%B1r%C4%B1mBayezit4.jpg/800px-Y%C4%B1ld%C4%B1r%C4%B1mBayezit4.jpg", bio: "Ben Yıldırım Bayezid! Savaş meydanlarında ordularımla gösterdiğim inanılmaz sürat sebebiyle Yıldırım lakabını aldım. Niğbolu Kalesi önünde Avrupa'nın dev Haçlı ordusunu yok ettim. Anadolu Türk birliğini sağladım ve İstanbul'u kuşatan ilk Osmanlı padişahı oldum." },
            { id: 5, name: "I. MEHMED (ÇELEBİ MEHMED)", era: "kurulus", img: "https://upload.wikimedia.org/wikipedia/commons/thumb/5/53/%C3%87elebi_Mehmet.jpg/800px-%C3%87elebi_Mehmet.jpg", bio: "Ben Çelebi Mehmed! Ankara Savaşı sonrasında yaşanan 11 yıllık kanlı Fetret Devri kargaşasına son verip devleti çöküşün eşiğinden kurtardım. Osmanlı Devleti'ni yeniden bir araya getirdiğim için ikinci kurucu olarak anılırım." },
            { id: 6, name: "II. MURAD", era: "kurulus", img: "https://upload.wikimedia.org/wikipedia/commons/thumb/5/50/II._Murat.jpg/800px-II._Murat.jpg", bio: "Ben II. Murad! Balkanlar'da Osmanlı hakimiyetini perçinledim. Varna ve II. Kosova zaferleriyle Haçlıların Türkleri Balkanlar'dan atma ümidini yok ettim. Tahtı kendi isteğimle oğlum Mehmed'e bıraktıysam da tekrar tahta geçip ordunun başına döndüm." },
            { id: 7, name: "II. MEHMED (FATİH SULTAN MEHMED)", era: "yukselme", img: "https://upload.wikimedia.org/wikipedia/commons/thumb/e/e1/Bellini%2C_Gentile_-_Sultan_Mehmet_II.jpg/800px-Bellini%2C_Gentile_-_Sultan_Mehmet_II.jpg", bio: "Ben Fatih Sultan Mehmed Han! Konstantiniyye'yi fethedip aleme nizam veren Cihangir padişahım. Akşemseddin ve Molla Gürani gibi alimlerin rahlesinde yetiştim; Türkçe hariç Arapça, Farsça, Latince, Yunanca, İbranice ve Sırpça olmak üzere 6 dil öğrendim. 21 yaşındayken 'Ya ben İstanbul'u alırım ya İstanbul beni' diyerek yola çıktım. Boğaz'ı kapatmak için Rumeli Hisarı'nı inşa ettirdim. Şahi adı verilen devasa sur yıkan topları bizzat çizip döktürdüm. 72 parça donanmayı bir gecede karadan Haliç'e indirdim. 29 Mayıs 1453 sabahı 1100 yıllık Doğu Roma İmparatorluğu'nu tarihe gömdüm. Bin yıllık Orta Çağ'ı kapatıp Yeni Çağ'ı başlattım. Kayser-i Rûm unvanını alarak İstanbul'u İslam'ın kalbi yaptım. Kanunname-i Âl-i Osman'ı kaleme alarak devletimi cihanşümul bir imparatorluk haline getirdim." },
            { id: 8, name: "II. BAYEZİD", era: "yukselme", img: "https://upload.wikimedia.org/wikipedia/commons/thumb/f/f7/Sultan_II._Bayezit.JPG/800px-Sultan_II._Bayezit.JPG", bio: "Ben II. Bayezid! Dindarlığım ve adaletim sebebiyle Sofi ve Veli unvanlarıyla anıldım. İspanya'daki Engizisyon zulmünden kaçan binlerce Müslüman ve Yahudi'yi Osmanlı donanmasıyla kurtarıp topraklarımıza getirdim." },
            { id: 9, name: "I. SELİM (YAVUZ SULTAN SELİM)", era: "yukselme", img: "https://upload.wikimedia.org/wikipedia/commons/thumb/2/22/Yavuz_Sultan_I._Selim_Han.jpg/800px-Yavuz_Sultan_I._Selim_Han.jpg", bio: "Ben Yavuz Sultan Selim! Sadece 8 yıl süren saltanatıma 80 yıllık fetih sığdırdım. Çaldıran zaferiyle Safevi tehlikesini önledim, Mercidabık ve Ridaniye zaferleriyle Mısır'ı fethettim. Mukaddes Emanetleri İstanbul'a getirerek ilk Osmanlı Halifesi oldum." },
            { id: 10, name: "I. SÜLEYMAN (KANUNİ SULTAN SÜLEYMAN)", era: "yukselme", img: "https://upload.wikimedia.org/wikipedia/commons/thumb/4/47/EmperorSuleiman.jpg/800px-EmperorSuleiman.jpg", bio: "Ben Kanuni Sultan Süleyman! 46 yıl boyunca adaletle hükmettiğim muhteşem tahtımda, İmparatorluğu 3 kıtaya ulaştırdım. Mohaç Meydan Muharebesi'ni 2 saatte kazandım. Barbaros Hayreddin Paşa ile Akdeniz'i bir Türk gölü haline getirdik." },
            { id: 11, name: "II. SELİM (SARI SELİM)", era: "yukselme", img: "https://upload.wikimedia.org/wikipedia/commons/thumb/9/9f/II._Selim_Han.jpg/800px-II._Selim_Han.jpg", bio: "Ben II. Selim! Dönemimde Kıbrıs adası fethedildi. Mimar Sinan, başyapıtı kabul edilen Selimiye Camii'ni benim dönemimde Edirne'de inşa etti." },
            { id: 12, name: "III. MURAD", era: "duraklama", img: "https://upload.wikimedia.org/wikipedia/commons/thumb/2/2f/III._Murat_Han.jpg/800px-III._Murat_Han.jpg", bio: "Ben III. Murad! Ferhat Paşa Antlaşması ile doğuda Hazar Denizi'ne ulaşarak Osmanlı Devleti'nin doğudaki en geniş sınırlarını çizdim." },
            { id: 13, name: "III. MEHMED", era: "duraklama", img: "https://upload.wikimedia.org/wikipedia/commons/thumb/3/36/Mehmed_III.jpg/800px-Mehmed_III.jpg", bio: "Ben III. Mehmed! Kanuni'den sonra ordunun başında sefere çıkan ilk padişahım. Haçova Meydan Muharebesi'ni kazanıp Eğri Fatihi unvanını aldım." },
            { id: 14, name: "I. AHMED", era: "duraklama", img: "https://upload.wikimedia.org/wikipedia/commons/thumb/6/65/Sultan_I._Ahmet.jpg/800px-Sultan_I._Ahmet.jpg", bio: "Ben I. Ahmed! En yaşlı şehzadenin tahta geçmesini sağlayan Ekber ve Erşed sistemini getirdim. İstanbul'un simgesi olan Sultanahmet Camii'ni yaptırdım." },
            { id: 15, name: "I. MUSTAFA", era: "duraklama", img: "https://upload.wikimedia.org/wikipedia/commons/thumb/3/39/Mustafa_1.jpg/800px-Mustafa_1.jpg", bio: "Ben I. Mustafa! Ekber ve Erşed sistemiyle tahta geçen ilk padişahım. İki kez tahta çıkarıldım." },
            { id: 16, name: "II. OSMAN (GENÇ OSMAN)", era: "duraklama", img: "https://upload.wikimedia.org/wikipedia/commons/thumb/5/56/Osman_2.jpg/800px-Osman_2.jpg", bio: "Ben Genç Osman! Henüz 14 yaşında tahta çıktım. Yeniçeri Ocağı'nı kaldırmak ve devlette reform yapmak istediğim için isyan eden yeniçerilerce şehit edildim." },
            { id: 17, name: "IV. MURAD", era: "duraklama", img: "https://upload.wikimedia.org/wikipedia/commons/thumb/d/d7/IV._Murat.jpg/800px-IV._Murat.jpg", bio: "Ben IV. Murad! Sert disiplinimle asayişi yeniden sağladım. Revan ve Bağdat seferlerine bizzat katılıp Bağdat Fatihi unvanını aldım." },
            { id: 18, name: "SULTAN İBRAHİM", era: "duraklama", img: "https://upload.wikimedia.org/wikipedia/commons/thumb/2/26/Ibrahim_I.jpg/800px-Ibrahim_I.jpg", bio: "Ben Sultan İbrahim! Dönemimde Akdeniz hâkimiyetimiz için kritik olan 24 yıllık çetin Girit Kuşatması başlatıldı." },
            { id: 19, name: "IV. MEHMED (AVCI MEHMED)", era: "duraklama", img: "https://upload.wikimedia.org/wikipedia/commons/thumb/d/d1/Sultan_Mehmed_IV_%282%29.jpg/800px-Sultan_Mehmed_IV_%282%29.jpg", bio: "Ben IV. Mehmed! 6 yaşındayken tahta oturdum ve 39 yıl kaldım. Av tutkum sebebiyle Avcı Mehmed olarak anıldım." },
            { id: 20, name: "II. SÜLEYMAN", era: "duraklama", img: "https://upload.wikimedia.org/wikipedia/commons/thumb/1/12/S%C3%BCleyman_II.jpg/800px-Süleyman_II.jpg", bio: "Ben II. Süleyman! Sadrazamlığa getirdiğim Köprülü Fazıl Mustafa Paşa sayesinde askeri ve mali alanda toparlanma sağladık." },
            { id: 21, name: "II. AHMED", era: "duraklama", img: "https://upload.wikimedia.org/wikipedia/commons/thumb/5/52/Ahmet_II.jpg/800px-Ahmet_II.jpg", bio: "Ben II. Ahmed! Kutsal İttifak devletleriyle yapılan ağır savaşlar döneminde tahtta kaldım." },
            { id: 22, name: "II. MUSTAFA", era: "gerileme", img: "https://upload.wikimedia.org/wikipedia/commons/thumb/4/48/II._Mustafa.jpg/800px-II._Mustafa.jpg", bio: "Ben II. Mustafa! 1699 Karlofça Antlaşması ile Batı'da ilk kez büyük çapta toprak kaybettik." },
            { id: 23, name: "III. AHMET", era: "gerileme", img: "https://upload.wikimedia.org/wikipedia/commons/thumb/b/b2/III._Ahmet.jpg/800px-III._Ahmet.jpg", bio: "Ben III. Ahmed! Lale Devri padişahıyım. İbrahim Müteferrika ile ilk Türk matbaasını kurduk." },
            { id: 24, name: "I. MAHMUD", era: "gerileme", img: "https://upload.wikimedia.org/wikipedia/commons/thumb/e/e0/Mahmud1.jpg/800px-Mahmud1.jpg", bio: "Ben I. Mahmud! Hendesehane'yi kurdum. 1739 Belgrat Antlaşması ile büyük bir zafer kazandım." },
            { id: 25, name: "III. OSMAN", era: "gerileme", img: "https://upload.wikimedia.org/wikipedia/commons/thumb/3/39/OsmanIII.jpg/800px-OsmanIII.jpg", bio: "Ben III. Osman! Nuruosmaniye Camii'ni tamamlatarak ibadete açtım." },
            { id: 26, name: "III. MUSTAFA", era: "gerileme", img: "https://upload.wikimedia.org/wikipedia/commons/thumb/4/4b/Mustafa3.jpg/800px-Mustafa3.jpg", bio: "Ben III. Mustafa! Deniz Mühendishanesi'ni kurarak modern deniz subayları yetiştirilmesini sağladım." },
            { id: 27, name: "I. ABDÜLHAMİD", era: "gerileme", img: "https://upload.wikimedia.org/wikipedia/commons/thumb/4/4f/Abdulhamid_I.jpg/800px-Abdulhamid_I.jpg", bio: "Ben I. Abdülhamid! Askeri reformlara hız verip İstihkam Okulu'nu açtım." },
            { id: 28, name: "III. SELİM", era: "gerileme", img: "https://upload.wikimedia.org/wikipedia/commons/thumb/e/eb/Joseph_Warnia-Zarzecki_-_Sultan_Selim_III_-_Google_Art_Project.jpg/800px-Joseph_Warnia-Zarzecki_-_Sultan_Selim_III_-_Google_Art_Project.jpg", bio: "Ben III. Selim! Batı tarzında köklü yenilikler içeren Nizam-ı Cedid hareketini ve yeni orduyu kurdum." },

            { id: 32, name: "SULTAN ABDÜLAZİZ", era: "dagilma", img: "https://upload.wikimedia.org/wikipedia/commons/thumb/f/f3/Abdulaziz.jpg/800px-Abdulaziz.jpg", bio: "Ben Sultan Abdülaziz! Avrupa devletlerine resmi ziyarette bulunan ilk Osmanlı padişahıyım. Güçlü bir zırhlı donanma kurdum." },

            { id: 36, name: "VI. MEHMED VAHİDEDDİN", era: "dagilma", img: "https://upload.wikimedia.org/wikipedia/commons/thumb/5/53/Sultan_Mehmed_VI.jpg/800px-Sultan_Mehmed_VI.jpg", bio: "Ben VI. Mehmed Vahideddin! Osmanlı'nın son padişahıyım." }
        ];

        let currentActiveId = null;
        let syntheticAudioUtterance = null;
        let currentEraFilter = 'all';

        function renderSultans() {
            const container = document.getElementById('sultans-container');
            const searchVal = document.getElementById('searchInput').value.toLowerCase().tr();
            container.innerHTML = "";

            const filtered = sultans.filter(sultan => {
                const matchesEra = (currentEraFilter === 'all' || sultan.era === currentEraFilter);
                const matchesSearch = sultan.name.toLowerCase().tr().includes(searchVal);
                return matchesEra && matchesSearch;
            });

            if (filtered.length === 0) {
                container.innerHTML = `<div style="text-align:center; padding: 40px; color: #888;">Aradığınız kriterlere uygun padişah bulunamadı.</div>`;
                return;
            }

            filtered.forEach(sultan => {
                const card = document.createElement('div');
                card.className = 'sultan-card';
                card.innerHTML = `
                    <div class="sultan-header">${sultan.id}. PADİŞAH</div>
                    <div class="image-container">
                        <img src="${sultan.img}" alt="${sultan.name}" loading="lazy" onerror="this.src='https://upload.wikimedia.org/wikipedia/commons/a/ac/No_image_available.svg'">
                    </div>
                    <div class="sultan-name">${sultan.name}</div>
                    <div class="sultan-quote-preview">“${sultan.bio}”</div>
                    <button class="play-btn" onclick="playSultanAudio(${sultan.id})">▶ Biyografi & Sesli Anlatım</button>
                `;
                container.appendChild(card);
            });
        }

        String.prototype.tr = function () {
            return this.replace(/İ/g, "i").replace(/I/g, "ı").replace(/Ğ/g, "ğ").replace(/Ü/g, "ü").replace(/Ş/g, "ş").replace(/Ö/g, "ö").replace(/Ç/g, "ç");
        };

        function filterSultans() {
            renderSultans();
        }

        function setEraFilter(era, btnElement) {
            currentEraFilter = era;
            document.querySelectorAll('.era-btn').forEach(btn => btn.classList.remove('active'));
            btnElement.classList.add('active');
            renderSultans();
        }

        function playSultanAudio(id) {
            const sultan = sultans.find(s => s.id === id);
            if (!sultan) return;

            currentActiveId = id;

            document.getElementById('panel-sultan-name').innerText = `${sultan.id}. ${sultan.name}`;
            document.getElementById('panel-sultan-bio').innerText = sultan.bio;
            
            document.getElementById('audio-panel').classList.add('active');

            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                syntheticAudioUtterance = new SpeechSynthesisUtterance(sultan.bio);
                syntheticAudioUtterance.lang = 'tr-TR';
                syntheticAudioUtterance.rate = 0.95;
                
                syntheticAudioUtterance.onend = function() {
                    document.getElementById('audio-status').innerText = "SESLİ ANLATIM TAMAMLANDI.";
                    document.getElementById('pause-play-btn').innerText = "BAŞLAT";
                };

                window.speechSynthesis.speak(syntheticAudioUtterance);
                document.getElementById('audio-status').innerText = "SESLİ ANLATIM ÇALINIYOR...";
                document.getElementById('pause-play-btn').innerText = "DURDUR";
            }
        }

        function togglePlayPause() {
            if (!('speechSynthesis' in window)) return;

            const btn = document.getElementById('pause-play-btn');
            const status = document.getElementById('audio-status');

            if (window.speechSynthesis.speaking) {
                if (window.speechSynthesis.paused) {
                    window.speechSynthesis.resume();
                    btn.innerText = "DURDUR";
                    status.innerText = "SESLİ ANLATIM ÇALINIYOR...";
                } else {
                    window.speechSynthesis.pause();
                    btn.innerText = "DEVAM ET";
                    status.innerText = "SESLİ ANLATIM DURDURULDU.";
                }
            } else if (currentActiveId !== null) {
                playSultanAudio(currentActiveId);
            }
        }

        function replayAudio() {
            if (currentActiveId !== null) {
                playSultan_Audio(currentActiveId);
            }
        }

        function closeAudioPanel() {
            document.getElementById('audio-panel').classList.remove('active');
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
            }
            currentActiveId = null;
        }

        window.onload = renderSultans;
    </script>
</body>
</html>
